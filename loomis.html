<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loomis Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; }

  #panel {
    position: fixed;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    padding: 16px 18px;
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    color: #e8e8e8;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    user-select: none;
  }
  #panel h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #9fd3ff;
    margin-bottom: 14px;
  }
  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row .label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    color: #b9b9b9;
  }
  .deg-box { display: inline-flex; align-items: center; gap: 3px; }
  .deg-box input {
    width: 64px;
    padding: 3px 6px;
    text-align: right;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font: inherit;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .deg-box input:focus {
    border-color: #4da3ff;
    box-shadow: 0 0 0 2px rgba(77, 163, 255, 0.2);
  }
  .deg-box i { font-style: normal; color: #8a8a8a; }

  .slider-line { display: flex; align-items: center; gap: 10px; }
  .slider-line input[type="range"] { flex: 1; width: auto; min-width: 0; }
  .axis-reset {
    flex: 0 0 auto;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
    color: #b9b9b9;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .axis-reset:hover { background: rgba(77, 163, 255, 0.28); color: #fff; border-color: #4da3ff; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.18);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4da3ff;
    border: 2px solid #0b0b0b;
    box-shadow: 0 0 6px rgba(77, 163, 255, 0.8);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 2px solid #0b0b0b;
    border-radius: 50%;
    background: #4da3ff;
  }
  .controls { display: flex; align-items: center; gap: 14px; }
  .slider-col { flex: 1; min-width: 0; }
  .btn-col { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
  #resetBtn,
  #exportBtn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 10px;
    border: 1px solid rgba(77, 163, 255, 0.5);
    background: rgba(77, 163, 255, 0.12);
    color: #9fd3ff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
  }
  #resetBtn:hover,
  #exportBtn:hover { background: rgba(77, 163, 255, 0.28); color: #fff; border-color: #4da3ff; }
  #resetBtn:active,
  #exportBtn:active { transform: scale(0.94); }
  .hint {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    color: #7d7d7d;
    font-size: 12px;
    line-height: 1.5;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6ab0ff;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">LOADING…</div>

  <div id="panel">
    <h2>MODEL CONTROL</h2>
    <div class="controls">
      <div class="slider-col" id="rows"></div>
      <div class="btn-col">
        <button id="resetBtn" type="button" title="全部复位">复位</button>
        <button id="exportBtn" type="button" title="导出透明背景 PNG">导出</button>
      </div>
    </div>
    <div class="hint">按住鼠标左右拖动，沿 Y 轴旋转模型<br />角度框可直接输入，回车生效</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------- 基础场景 ----------
    const container = document.getElementById('app');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true // 导出透明背景 PNG 时需要保留绘制缓冲
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // ---------- 部件配色（按 glb 中的部件名匹配） ----------
    const PART_COLORS = [
      { test: (n) => n === 'X', color: 0xff5f5f },        // X 轴部件
      { test: (n) => n === 'Y', color: 0x5fd07a },        // Y 轴部件
      { test: (n) => n === 'Z', color: 0x4da3ff },        // Z 轴部件
      { test: (n) => n.startsWith('平面'), color: 0xffc857 }, // 平面
      { test: (n) => n.startsWith('球体'), color: 0xb07cff }  // 球体
    ];
    const DEFAULT_COLOR = 0xd0d0d0;

    function getPartColor(name) {
      const hit = PART_COLORS.find((p) => p.test(name));
      return hit ? hit.color : DEFAULT_COLOR;
    }

    // ---------- 灯光 ----------
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(4, 6, 8);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 1.0);
    fillLight.position.set(-6, 2, -5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.2);
    rimLight.position.set(0, -5, 3);
    scene.add(rimLight);

    // ---------- 模型容器 ----------
    // 三个轴的旋转统一作用在 modelRoot 上，modelGroup 承载模型自身居中
    const modelRoot = new THREE.Group();
    const modelGroup = new THREE.Group();

    modelRoot.add(modelGroup);
    scene.add(modelRoot);

    const DEG = Math.PI / 180;
    const MIN_DEG = -180;
    const MAX_DEG = 180;

    // ---------- 三轴状态（单位：度） ----------
    const AXES = [
      { key: 'x', label: 'X 轴旋转' },
      { key: 'y', label: 'Y 轴旋转' },
      { key: 'z', label: 'Z 轴旋转' }
    ];

    const targetDeg = { x: 0, y: 0, z: 0 };   // 目标角度
    const currentDeg = { x: 0, y: 0, z: 0 };  // 当前角度（插值用）
    const ui = {};                            // key -> { numberInput, rangeInput }

    const clampDeg = (v) => Math.min(MAX_DEG, Math.max(MIN_DEG, v));

    // ---------- 左侧控制面板 ----------
    const rowsEl = document.getElementById('rows');

    AXES.forEach(({ key, label }) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div class="label">' +
          '<span>' + label + '</span>' +
          '<span class="deg-box">' +
            '<input type="number" min="' + MIN_DEG + '" max="' + MAX_DEG + '" step="1" value="0" />' +
            '<i>°</i>' +
          '</span>' +
        '</div>' +
        '<div class="slider-line">' +
          '<input type="range" min="' + MIN_DEG + '" max="' + MAX_DEG + '" step="1" value="0" />' +
          '<button class="axis-reset" type="button" title="' + label + '复位">复位</button>' +
        '</div>';

      const numberInput = row.querySelector('input[type="number"]');
      const rangeInput = row.querySelector('input[type="range"]');
      const resetButton = row.querySelector('.axis-reset');

      ui[key] = { numberInput, rangeInput };

      // 拖动滑块
      rangeInput.addEventListener('input', () => setAngle(key, Number(rangeInput.value)));

      // 手动输入：回车 / 失焦生效
      numberInput.addEventListener('change', () => applyNumberInput(key));
      numberInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') applyNumberInput(key);
      });

      // 单轴复位
      resetButton.addEventListener('click', () => setAngle(key, 0));

      rowsEl.appendChild(row);
    });

    // 设置某轴角度，并同步该行的滑块与输入框
    function setAngle(key, deg) {
      targetDeg[key] = clampDeg(deg);
      const v = Math.round(targetDeg[key]);
      ui[key].rangeInput.value = v;
      ui[key].numberInput.value = v;
    }

    // 读取输入框数值并应用（非法输入回退为 0）
    function applyNumberInput(key) {
      const raw = parseFloat(ui[key].numberInput.value);
      setAngle(key, isNaN(raw) ? 0 : raw);
    }

    // ---------- 全部复位 ----------
    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', () => {
      AXES.forEach(({ key }) => setAngle(key, 0));
    });

    // ---------- 导出当前旋转状态为透明背景 PNG ----------
    const exportBtn = document.getElementById('exportBtn');
    exportBtn.addEventListener('click', () => {
      const prevBackground = scene.background;
      scene.background = null; // 透明背景
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      scene.background = prevBackground; // 恢复原背景
      renderer.render(scene, camera);

      const a = document.createElement('a');
      a.href = url;
      a.download =
        'loomis_x' + Math.round(currentDeg.x) +
        '_y' + Math.round(currentDeg.y) +
        '_z' + Math.round(currentDeg.z) + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // ---------- 鼠标拖拽：沿 Y 轴旋转（与 Y 轴滑块同步） ----------
    const el = renderer.domElement;
    let dragging = false;
    let lastX = 0;
    const DRAG_SENSITIVITY = 0.6; // 每像素旋转的度数

    el.style.cursor = 'grab';

    el.addEventListener('pointerdown', (e) => {
      dragging = true;
      lastX = e.clientX;
      el.style.cursor = 'grabbing';
      el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      setAngle('y', targetDeg.y + (e.clientX - lastX) * DRAG_SENSITIVITY);
      lastX = e.clientX;
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      el.style.cursor = 'grab';
      if (e && e.pointerId !== undefined && el.hasPointerCapture(e.pointerId)) {
        el.releasePointerCapture(e.pointerId);
      }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
    el.addEventListener('pointerleave', endDrag);

    // ---------- 加载模型 ----------
    const loadingEl = document.getElementById('loading');
    const loader = new GLTFLoader();

    loader.load(
      'data:model/gltf-binary;base64,' + model_base64,
      (gltf) => {
        const model = gltf.scene;

        // 计算包围盒，居中并统一缩放
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        // 先居中
        model.position.sub(center);
        modelGroup.add(model);

        // 根据最大边自适应相机距离
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const fitHeightDistance = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
        const fitWidthDistance = fitHeightDistance / camera.aspect;
        const distance = 1.6 * Math.max(fitHeightDistance, fitWidthDistance);

        camera.position.set(0, 0, distance);
        camera.lookAt(0, 0, 0);
        camera.near = distance / 100;
        camera.far = distance * 100;
        camera.updateProjectionMatrix();

        // 使用 glb 自带材质给不同部件着色（改这里即可调整配色）
        model.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;

          // glb 中多个部件可能共用同一材质实例，克隆后各自着色，避免相互影响
          const mat = child.material.clone();
          mat.color.setHex(getPartColor(child.name));
          mat.needsUpdate = true;
          child.material = mat;
        });

        loadingEl.style.display = 'none';
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          loadingEl.textContent = 'LOADING… ' + pct + '%';
        }
      },
      (err) => {
        console.error(err);
        loadingEl.textContent = '模型加载失败：' + err.message;
        loadingEl.style.color = '#ff6b6b';
      }
    );

    // ---------- 响应式 ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- 渲染循环 ----------
    const SMOOTH = 0.12;

    function animate() {
      requestAnimationFrame(animate);

      for (const { key } of AXES) {
        currentDeg[key] += (targetDeg[key] - currentDeg[key]) * SMOOTH;
      }

      modelRoot.rotation.set(
        currentDeg.x * DEG,
        currentDeg.y * DEG,
        currentDeg.z * DEG
      );

      renderer.render(scene, camera);
    }
    animate();
  </script>
